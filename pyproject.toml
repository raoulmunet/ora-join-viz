[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="ora-join-viz"
version="0.1.0"
description="Visualize common Oracle ANSI JOIN relationships."
readme="README.md"
requires-python=">=3.10"
license={text="MIT"}
authors=[{name="Raoul Munet"}]
dependencies=[]
[project.optional-dependencies]
dev=["pytest>=8"]
[project.scripts]
ora-join-viz="ora_join_viz.cli:main"
[tool.setuptools.packages.find]
where=["src"]
[tool.pytest.ini_options]
pythonpath=["src"]
testpaths=["tests"]
